<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" font-family="Nunito, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5B4B"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D96A1C"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B2B1B" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="880" fill="#FFF8EE"/>

  <text x="40" y="46" font-size="28" font-weight="800" fill="#3B2B1B">Milo — system architecture (as built)</text>
  <text x="40" y="72" font-size="15" fill="#7A6A5A">The engine decides what to teach and when to be gentle. The model only finds warmer words — and a scripted twin always stands behind it.</text>

  <!-- ============ CLIENT ============ -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="270" height="400" rx="20" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="3"/>
  </g>
  <text x="60" y="144" font-size="18" font-weight="800" fill="#3B2B1B">Child's browser</text>
  <text x="60" y="165" font-size="13" fill="#7A6A5A">React 18 + Vite single-page app</text>
  <g font-size="14" fill="#3B2B1B">
    <rect x="60" y="182" width="230" height="44" rx="12" fill="#FFE3C9"/><text x="76" y="209">Home · one big “Let's go!”</text>
    <rect x="60" y="234" width="230" height="44" rx="12" fill="#D9EEFF"/><text x="76" y="261">Chat · emoji chips, typing</text>
    <rect x="60" y="286" width="230" height="44" rx="12" fill="#EAF6EC"/><text x="76" y="313">My progress · words &amp; levels</text>
    <rect x="60" y="338" width="230" height="44" rx="12" fill="#EADFFF"/><text x="76" y="365">Kids · maths-gated edit / add</text>
  </g>
  <text x="60" y="412" font-size="13" fill="#6B5B4B">localStorage: random device id</text>
  <text x="60" y="431" font-size="13" fill="#6B5B4B">(profiles belong to this browser;</text>
  <text x="60" y="448" font-size="13" fill="#6B5B4B">no accounts, no passwords)</text>
  <text x="60" y="478" font-size="13" fill="#6B5B4B">No microphone, no audio anywhere</text>

  <!-- client <-> server arrows -->
  <line x1="312" y1="250" x2="378" y2="250" stroke="#D96A1C" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="378" y1="300" x2="312" y2="300" stroke="#6B5B4B" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="7 5"/>
  <text x="318" y="236" font-size="12" fill="#D96A1C" font-weight="700">POST</text>
  <text x="318" y="320" font-size="12" fill="#6B5B4B" font-weight="700">SSE</text>
  <text x="40" y="540" font-size="12.5" fill="#6B5B4B">HTTPS · POST /api/session</text>
  <text x="40" y="558" font-size="12.5" fill="#6B5B4B">POST /api/message → SSE stream</text>
  <text x="40" y="576" font-size="12.5" fill="#6B5B4B">x-milo-device header · same-origin only</text>

  <!-- ============ SERVER ============ -->
  <g filter="url(#sh)">
    <rect x="380" y="110" width="560" height="560" rx="20" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="3"/>
  </g>
  <text x="400" y="144" font-size="18" font-weight="800" fill="#3B2B1B">One Fastify 5 process · Node · Docker on Render</text>
  <text x="400" y="165" font-size="13" fill="#7A6A5A">serves the built client, the JSON API and the SSE stream</text>

  <rect x="400" y="180" width="520" height="40" rx="12" fill="#FFF1E0" stroke="#FFD9A8" stroke-width="2"/>
  <text x="416" y="205" font-size="14" fill="#3B2B1B"><tspan font-weight="800">Guards</tspan> · cross-origin writes refused · device ownership checks</text>

  <!-- pipeline -->
  <g font-size="14" fill="#3B2B1B">
    <rect x="400" y="236" width="250" height="62" rx="12" fill="#FFE8EC" stroke="#F5C2CC" stroke-width="2"/>
    <text x="414" y="259" font-weight="800">① Safety first</text><text x="414" y="280" font-size="12.5" fill="#6B5B4B">crisis · personal · scary · mean</text>

    <rect x="670" y="236" width="250" height="62" rx="12" fill="#EAF6EC" stroke="#BFE0C6" stroke-width="2"/>
    <text x="684" y="259" font-weight="800">② Mood from typed words</text><text x="684" y="280" font-size="12.5" fill="#6B5B4B">never asked with buttons</text>

    <rect x="400" y="316" width="250" height="62" rx="12" fill="#D9EEFF" stroke="#B3D6F2" stroke-width="2"/>
    <text x="414" y="339" font-weight="800">③ Mode detector</text><text x="414" y="360" font-size="12.5" fill="#6B5B4B">learning · chat · play · support</text>

    <rect x="670" y="316" width="250" height="62" rx="12" fill="#FFE3C9" stroke="#F5C28F" stroke-width="2"/>
    <text x="684" y="339" font-weight="800">④ Curriculum engine</text><text x="684" y="360" font-size="12.5" fill="#6B5B4B">L1–L3 · Leitner · gates · graduation</text>

    <rect x="400" y="396" width="250" height="78" rx="12" fill="#EADFFF" stroke="#CDBCF0" stroke-width="2"/>
    <text x="414" y="419" font-weight="800">⑤ Composer</text><text x="414" y="440" font-size="12.5" fill="#6B5B4B">strict “turn brief” per moment +</text><text x="414" y="457" font-size="12.5" fill="#6B5B4B">a scripted twin for the same moment</text>

    <rect x="670" y="396" width="250" height="78" rx="12" fill="#FFF9E4" stroke="#F2DC9A" stroke-width="2"/>
    <text x="684" y="419" font-weight="800">⑥ Output checks</text><text x="684" y="440" font-size="12.5" fill="#6B5B4B">never “wrong” · must-word · pinned</text><text x="684" y="457" font-size="12.5" fill="#6B5B4B">ending · no repeats → else the twin</text>
  </g>
  <!-- pipeline arrows -->
  <line x1="650" y1="267" x2="668" y2="267" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M795 298 L795 306 L525 306 L525 314" fill="none" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="650" y1="347" x2="668" y2="347" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M795 378 L795 386 L525 386 L525 394" fill="none" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="650" y1="435" x2="668" y2="435" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- progress / memory -->
  <rect x="400" y="494" width="250" height="78" rx="12" fill="#F4F0EA" stroke="#E0D6C8" stroke-width="2"/>
  <text x="414" y="517" font-size="14" font-weight="800" fill="#3B2B1B">Memory (context-aware)</text>
  <text x="414" y="538" font-size="12.5" fill="#6B5B4B">learner card: level, struggling words,</text>
  <text x="414" y="555" font-size="12.5" fill="#6B5B4B">interests, last session, mood now</text>
  <rect x="670" y="494" width="250" height="78" rx="12" fill="#F4F0EA" stroke="#E0D6C8" stroke-width="2"/>
  <text x="684" y="517" font-size="14" font-weight="800" fill="#3B2B1B">Progress summary</text>
  <text x="684" y="538" font-size="12.5" fill="#6B5B4B">level path, words known, feelings</text>
  <text x="684" y="555" font-size="12.5" fill="#6B5B4B">shared, milestones (derived, live)</text>
  <text x="400" y="602" font-size="13" fill="#6B5B4B">One action → one Milo bubble. First words stream in ≈ 0.5 s; whole turn &lt; 1 s</text>
  <text x="400" y="621" font-size="13" fill="#6B5B4B">measured on the live deployment (budget: 2 s end to end).</text>
  <text x="400" y="650" font-size="12.5" fill="#7A6A5A">Tests: 80 unit · 19 requirement checks · 23 headless-browser checks</text>

  <!-- composer -> LLM ladder (the brief goes out) and model text -> output checks (it comes back) -->
  <path d="M525 474 L525 486 L966 486 L966 215 L1013 215" fill="none" stroke="#D96A1C" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="984" y="330" font-size="12" fill="#D96A1C" font-weight="700" transform="rotate(-90 984 330)">turn brief →</text>
  <line x1="1013" y1="445" x2="923" y2="445" stroke="#6B5B4B" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="946" y="437" font-size="11.5" fill="#6B5B4B" font-weight="700">text</text>

  <!-- ============ LLM LADDER ============ -->
  <g filter="url(#sh)">
    <rect x="995" y="110" width="245" height="400" rx="20" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="3"/>
  </g>
  <text x="1015" y="144" font-size="18" font-weight="800" fill="#3B2B1B">Phrasing ladder</text>
  <text x="1015" y="165" font-size="12.5" fill="#7A6A5A">first token ≤ 1.2 s, else next rung</text>
  <g font-size="14" fill="#3B2B1B">
    <rect x="1015" y="184" width="205" height="62" rx="12" fill="#FFE3C9"/>
    <text x="1029" y="208" font-weight="800">Groq · gpt-oss-120b</text><text x="1029" y="228" font-size="12.5" fill="#6B5B4B">primary, streaming</text>
    <rect x="1015" y="268" width="205" height="62" rx="12" fill="#FFE3C9"/>
    <text x="1029" y="292" font-weight="800">Groq · gpt-oss-20b</text><text x="1029" y="312" font-size="12.5" fill="#6B5B4B">own quota, used on 429</text>
    <rect x="1015" y="352" width="205" height="62" rx="12" fill="#F4F0EA"/>
    <text x="1029" y="376" font-weight="800">Gemini Flash</text><text x="1029" y="396" font-size="12.5" fill="#6B5B4B">optional extra rung</text>
    <rect x="1015" y="436" width="205" height="62" rx="12" fill="#CFEFD3" stroke="#8FCB9B" stroke-width="2"/>
    <text x="1029" y="460" font-weight="800">Scripted twin</text><text x="1029" y="480" font-size="12.5" fill="#2F6B3B">always on · ~10 ms</text>
  </g>
  <line x1="1117" y1="246" x2="1117" y2="266" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1117" y1="330" x2="1117" y2="350" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1117" y1="414" x2="1117" y2="434" stroke="#6B5B4B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="995" y="530" font-size="12.5" fill="#6B5B4B">Rate limit, timeout or a failed check →</text>
  <text x="995" y="548" font-size="12.5" fill="#6B5B4B">the child still gets a warm, correct line.</text>

  <!-- ============ DATA ============ -->
  <g filter="url(#sh)">
    <rect x="380" y="700" width="560" height="140" rx="20" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="3"/>
  </g>
  <text x="400" y="732" font-size="18" font-weight="800" fill="#3B2B1B">SQLite (node:sqlite) · one file</text>
  <g font-size="13.5" fill="#3B2B1B">
    <rect x="400" y="748" width="150" height="34" rx="10" fill="#FFE3C9"/><text x="412" y="770">children (+ owner)</text>
    <rect x="560" y="748" width="150" height="34" rx="10" fill="#EAF6EC"/><text x="572" y="770">item_progress</text>
    <rect x="720" y="748" width="100" height="34" rx="10" fill="#D9EEFF"/><text x="732" y="770">sessions</text>
    <rect x="830" y="748" width="90" height="34" rx="10" fill="#EADFFF"/><text x="842" y="770">events</text>
    <rect x="400" y="790" width="100" height="34" rx="10" fill="#FFF9E4"/><text x="412" y="812">badges</text>
  </g>
  <text x="520" y="812" font-size="12.5" fill="#6B5B4B">Free tier: temporary disk → profiles may reset.</text>
  <line x1="620" y1="672" x2="620" y2="698" stroke="#6B5B4B" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="700" y1="698" x2="700" y2="672" stroke="#6B5B4B" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="40" y="650" font-size="13" fill="#6B5B4B">Content bank: 55 L1 · 49 L2 · 14 L3 items</text>
  <text x="40" y="670" font-size="13" fill="#6B5B4B">(words, feelings, numbers, sentences)</text>

  <!-- legend -->
  <rect x="40" y="720" width="310" height="120" rx="16" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="2"/>
  <text x="58" y="748" font-size="14" font-weight="800" fill="#3B2B1B">Key idea</text>
  <text x="58" y="772" font-size="13" fill="#6B5B4B">Pedagogy is deterministic code.</text>
  <text x="58" y="792" font-size="13" fill="#6B5B4B">Warmth is generative, but checked,</text>
  <text x="58" y="812" font-size="13" fill="#6B5B4B">with a scripted fallback at every step.</text>
</svg>
