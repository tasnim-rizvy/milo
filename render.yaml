# Render blueprint — https://render.com/docs/blueprint-spec
# Free plan: Docker web service, no credit card, spins down after idle
# (first request after a nap takes ~30 s to wake).
services:
  - type: web
    name: milo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Optional LLM warmth — free tiers, no credit card (docs/02 §5):
    #   GEMINI_API_KEY — create at aistudio.google.com
    #   GROQ_API_KEY   — create at console.groq.com
    # Paste at deploy time or later in Dashboard → Environment. Without keys
    # Milo runs fully scripted; /api/health lists whichever keys are on.
    envVars:
      - key: NODE_ENV
        value: production
